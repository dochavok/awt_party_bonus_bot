# AWT Party Bonus Bot: engine scenario tests
# ---------------------------------------------------------------------------
# Each scenario describes who is in the voice channel, what their characters
# have, and the totals each counted player should receive. The test runner
# loads this file, builds the engine inputs, and compares results with `expect`.
#
# These tests use their own catalog (below), not the real one in data/, so a
# change to a real catalog value doesn't break them. The values mirror the
# starting catalog in the requirements (section 8).
#
# Conventions
#   - Players are keyed by character name, or Discord name if they have no character.
#   - `has` lists catalog entries (skills, boons, items, awards).
#   - `guilds` maps guild ID to {rank: ...}; `roles` lists Discord roles.
#   - Totals list only non-zero stats. A stat not listed is expected to be 0,
#     except a CR subtype not listed, which is expected to equal CR.
#   - `not_applied` (optional) lists entries that must appear in the recipient's
#     NOT APPLIED section, with the reason code.
#   - `effects` (optional) lists effect text and who receives it.
#   - `conditional` (optional) lists conditional bonuses each recipient is shown
#     separately; these are never included in `expect` totals.
#   - `not_counted` / `no_character` (optional) list who must appear in those sections.
#
# Reason codes: giver_excluded, not_in_audience, no_level, replaced, not_stacked
# ---------------------------------------------------------------------------

catalog:
  stats:
    CM:               {kind: roll}
    CR:               {kind: roll}
    CR vs fear:       {kind: roll, parent: CR}
    CR stealth:       {kind: roll, parent: CR}
    CR would hurt:    {kind: roll, parent: CR}
    Damage:           {kind: combat_note, unit: hearts}
    Damage reduction: {kind: combat_note, unit: hearts}
    Healing:          {kind: combat_note, unit: hearts}

  entries:
    # Skills
    Holy Aura:           {kind: skill, tree: Holy Knight, tags: [aura], gives: {CR vs fear: 2}}
    Bolstering Aura:     {kind: skill, tree: Holy Knight, tags: [aura], gives: {CM: 2}}
    Protective Aura:     {kind: skill, tree: Holy Knight, tags: [aura],
                          effect: "Resistance to damage from an Evil source"}
    Devotion III:        {kind: skill, tree: Holy Knight, modifies: {tag: aura, add: 1}}
    Aura of Defense:     {kind: skill, tree: Paladin, tags: [aura], gives: {CR would hurt: 5}}
    Aura of Hope:        {kind: skill, tree: Paladin, tags: [aura], gives: {CM: 10}}
    Commanding Presence: {kind: skill, tree: Commander, gives: {CM: 5},
                          condition: "allies in the same range"}
    Inspiring Presence:  {kind: skill, tree: Commander, gives: {CR: 5}, stacks: false}
    # GoTH boons
    Nuyaru's Love:       {kind: boon, guild: GoTH, gives: {CM: 1}}
    Seraph's Affection:  {kind: boon, guild: GoTH, gives: {CM: 3}, replaces: [Nuyaru's Love]}
    # Items and awards
    Wills ward stone:    {kind: item, gives: {CM: 5}}
    NF pin:              {kind: item, gives: {CM: 1}}
    Champion of Power:   {kind: award, gives: {CR: 5, CM: 5}}
    # Test-only entries
    Test Buff:           {kind: item, gives: {CM: 2}}
    Test Focus:          {kind: item, gives: {CR: 2}}
    Old Charm:           {kind: item, gives: {CM: 1}, retired: true}

  guilds:
    Guild:
      full_name: The Guild
      membership: roles
      ranks: [Junior Adventurer, Guild Veteran, Guild Vanguard, Guild Champion, Guild Legend]
      abilities:
        - {name: Support, gives: {CM: 2}}
    GoTH:
      full_name: Guild of the Timeless Heroes
      membership: open
    Thieves:
      full_name: Guild of Thieves
      membership: open
      secret: true
      ranks: [Footpad, Burglar, Guild Thief]
      abilities:
        - {name: Rat Pack, audience: guild, gives: {CM: 1}}
        - {name: Leadership, min_rank: Guild Thief, audience: guild,
           includes_giver: true, stacks: false, gives: {CM: 2, CR stealth: 2}}
    Pirates:
      full_name: Pirate Coalition
      membership: open
      ranks: [Swabbie, Crew Mate, First Mate, Captain]
      abilities:
        - {name: King of the Pirates, min_rank: Captain, audience: guild,
           includes_giver: true, stacks: false, gives: {CM: 2}}
    Cult:
      full_name: Cult of the Dragon
      membership: open
      ranks: [Member, High Priest]
      abilities:
        - name: Cult of the Dragon
          min_rank: High Priest
          audience: guild
          stacks: false
          level_rules:
            - {when: "< 10",  gives: {Damage: 1}}
            - {when: ">= 10", gives: {CM: 10}}
    Rangers:
      full_name: Ranger's Guild
      membership: open
      ranks: [Apprentice, Journeyman, Ranger Captain, Master Ranger]
      abilities:
        - {name: Wilderness Lore, min_rank: Ranger Captain, includes_giver: true,
           effect: "Challenge rolls to resist natural effects are one roll category easier"}

scenarios:

  # ---------------------------------------------------------------- RULES 1-2
  - name: CM goes to allies (three givers of +2 CM)
    rule: "4.1, 4.2"
    players:
      - {name: A, has: [Test Buff]}
      - {name: B, has: [Test Buff]}
      - {name: C, has: [Test Buff]}
      - {name: D}
    expect:
      A: {CM: 4}
      B: {CM: 4}
      C: {CM: 4}
      D: {CM: 6}
    not_applied:
      A: [{entry: Test Buff, from: A, reason: giver_excluded}]

  - name: CR also goes to allies only (three givers of +2 CR)
    rule: "4.2"
    players:
      - {name: A, has: [Test Focus]}
      - {name: B, has: [Test Focus]}
      - {name: C, has: [Test Focus]}
      - {name: D}
    expect:
      A: {CR: 4}
      B: {CR: 4}
      C: {CR: 4}
      D: {CR: 6}

  # ---------------------------------------------------------------- SUPPORT
  - name: Support from five Guild rank holders
    rule: "4 worked example"
    players:
      - {name: P1, roles: [Junior Adventurer]}
      - {name: P2, roles: [Guild Veteran]}
      - {name: P3, roles: [Guild Vanguard]}
      - {name: P4, roles: [Guild Champion]}
      - {name: P5, roles: [Guild Legend]}
      - {name: Outsider}
    expect:
      P1: {CM: 8}
      P2: {CM: 8}
      P3: {CM: 8}
      P4: {CM: 8}
      P5: {CM: 8}
      Outsider: {CM: 10}

  - name: Multiple Guild roles still give Support once
    rule: "HV-3 (highest role sets the rank)"
    players:
      - {name: A, roles: [Junior Adventurer, Guild Veteran]}
      - {name: B}
    expect:
      A: {}
      B: {CM: 2}

  # ---------------------------------------------------------------- RULE 7
  - name: Parent CR flows into its subtypes
    rule: "4.7"
    players:
      - {name: A, has: [Champion of Power]}
      - {name: B, has: [Holy Aura]}
      - {name: C}
    expect:
      A: {CR vs fear: 2}
      B: {CM: 5, CR: 5, CR vs fear: 5}
      C: {CM: 5, CR: 5, CR vs fear: 7}

  # ---------------------------------------------------------------- RULE 1 (duplicates)
  - name: Same skill from two characters stacks
    rule: "4.1"
    players:
      - {name: Knight1, has: [Holy Aura]}
      - {name: Knight2, has: [Holy Aura]}
      - {name: C}
    expect:
      Knight1: {CR vs fear: 2}
      Knight2: {CR vs fear: 2}
      C:       {CR vs fear: 4}

  # ---------------------------------------------------------------- RULE 6 (modifiers)
  - name: Devotion III boosts only its own character's auras
    rule: "4.6"
    players:
      - {name: K1, has: [Holy Aura, Bolstering Aura, Devotion III]}
      - {name: K2, has: [Holy Aura]}
      - {name: C}
    expect:
      K1: {CR vs fear: 2}
      K2: {CM: 3, CR vs fear: 3}
      C:  {CM: 3, CR vs fear: 5}

  - name: Devotion III boosts Paladin auras but not Presence skills
    rule: "4.6, 4.12; DM question Q1"
    players:
      - {name: P, has: [Aura of Hope, Aura of Defense, Commanding Presence, Devotion III]}
      - {name: C}
    expect:
      P: {}
      C: {CM: 11, CR would hurt: 6}      # Aura of Hope 10+1, Aura of Defense 5+1
    conditional:
      C: [{entry: Commanding Presence, from: P, gives: {CM: 5}, condition: "allies in the same range"}]

  - name: Conditional bonuses stay out of totals but follow the other rules
    rule: "4.12"
    players:
      - {name: Cmd, has: [Commanding Presence]}
      - {name: A, has: [Test Buff]}
    expect:
      Cmd: {CM: 2}                       # Test Buff from A; own Commanding Presence excluded
      A:   {}                            # Commanding Presence listed, not totaled
    conditional:
      A: [{entry: Commanding Presence, from: Cmd, gives: {CM: 5}, condition: "allies in the same range"}]

  # ---------------------------------------------------------------- RULE 4 (stacking)
  - name: Inspiring Presence doesn't stack
    rule: "4.4"
    players:
      - {name: A, has: [Inspiring Presence]}
      - {name: B, has: [Inspiring Presence]}
      - {name: C}
    expect:
      A: {CR: 5}                         # from B
      B: {CR: 5}                         # from A
      C: {CR: 5}                         # counted once

  # ---------------------------------------------------------------- RULE 5 (replacements)
  - name: Seraph's Affection replaces Nuyaru's Love
    rule: "4.5; DM question Q3"
    players:
      - {name: A, guilds: {GoTH: {}}, has: [Nuyaru's Love, Seraph's Affection]}
      - {name: C, guilds: {GoTH: {}}, has: [Nuyaru's Love]}
      - {name: B}
    expect:
      A: {CM: 1}                         # from C
      C: {CM: 3}                         # from A
      B: {CM: 4}                         # 3 from A, 1 from C
    not_applied:
      B: [{entry: Nuyaru's Love, from: A, reason: replaced}]

  # ---------------------------------------------------------------- RULES 3, 8, 9 (guilds)
  - name: Thieves - Rat Pack per other member, Leadership once and includes the giver
    rule: "4.3, 4.4, 4.8, 4.9"
    players:
      - {name: T1, guilds: {Thieves: {rank: Guild Thief}}}
      - {name: T2, guilds: {Thieves: {rank: Guild Thief}}}
      - {name: T3, guilds: {Thieves: {rank: Footpad}}}
      - {name: O}
    expect:
      T1: {CM: 4, CR stealth: 2}         # Rat Pack 1+1, Leadership 2 (once)
      T2: {CM: 4, CR stealth: 2}
      T3: {CM: 4, CR stealth: 2}
      O:  {}

  - name: Thieves with no Guild Thief get Rat Pack only
    rule: "4.9 (minimum rank)"
    players:
      - {name: F1, guilds: {Thieves: {rank: Footpad}}}
      - {name: F2, guilds: {Thieves: {rank: Burglar}}}
    expect:
      F1: {CM: 1}
      F2: {CM: 1}

  - name: King of the Pirates includes the Captain
    rule: "4.3"
    players:
      - {name: Cap, guilds: {Pirates: {rank: Captain}}}
      - {name: M,   guilds: {Pirates: {rank: Swabbie}}}
      - {name: O}
    expect:
      Cap: {CM: 2}
      M:   {CM: 2}
      O:   {}

  # ---------------------------------------------------------------- RULE 10 (level)
  - name: Cult High Priest gives by the recipient's level
    rule: "4.10; DM question Q2"
    players:
      - {name: HP, level: 22, guilds: {Cult: {rank: High Priest}}}
      - {name: K,  level: 8,  guilds: {Cult: {rank: Member}}}
      - {name: L,  level: 10, guilds: {Cult: {rank: Member}}}
      - {name: N,             guilds: {Cult: {rank: Member}}}   # no level
      - {name: O,  level: 20}
    expect:
      HP: {}
      K:  {Damage: 1}
      L:  {CM: 10}                       # exactly 10 uses the ">= 10" band
      N:  {}
      O:  {}
    not_applied:
      HP: [{entry: Cult of the Dragon, from: HP, reason: giver_excluded}]
      N:  [{entry: Cult of the Dragon, from: HP, reason: no_level}]
      O:  [{entry: Cult of the Dragon, from: HP, reason: not_in_audience}]

  - name: Ordinary Cult members give nothing
    rule: "4.9"
    players:
      - {name: M1, level: 20, guilds: {Cult: {rank: Member}}}
      - {name: M2, level: 20, guilds: {Cult: {rank: Member}}}
    expect:
      M1: {}
      M2: {}

  - name: Two High Priests don't stack
    rule: "4.4"
    players:
      - {name: HP1, level: 20, guilds: {Cult: {rank: High Priest}}}
      - {name: HP2, level: 20, guilds: {Cult: {rank: High Priest}}}
      - {name: M,   level: 15, guilds: {Cult: {rank: Member}}}
    expect:
      HP1: {CM: 10}                      # from HP2
      HP2: {CM: 10}                      # from HP1
      M:   {CM: 10}                      # counted once

  # ---------------------------------------------------------------- EFFECTS
  - name: Effects follow the giver rule and minimum rank
    rule: "4.2, 4.3, 4.9"
    players:
      - {name: K,  has: [Protective Aura]}
      - {name: R1, guilds: {Rangers: {rank: Ranger Captain}}}
      - {name: R2, guilds: {Rangers: {rank: Journeyman}}}
    expect:
      K:  {}
      R1: {}
      R2: {}
    effects:
      - {text: "Resistance to damage from an Evil source", from: K, to: [R1, R2]}
      - {text: "Challenge rolls to resist natural effects are one roll category easier",
         from: R1, to: [K, R1, R2]}

  # ---------------------------------------------------------------- CATALOG
  - name: A retired entry still counts for characters who have it
    rule: "CT-6"
    players:
      - {name: A, has: [Old Charm]}
      - {name: B}
    expect:
      A: {}
      B: {CM: 1}

  # ---------------------------------------------------------------- PRESENCE
  - name: Sitting out removes giving and receiving
    rule: "4.11, SE-2"
    players:
      - {name: DM, sitout: true, has: [Champion of Power]}
      - {name: A,  has: [Test Buff]}
      - {name: B}
    expect:
      A: {}
      B: {CM: 2}
    not_counted: [DM]

  - name: Everyone sitting out gives an empty party
    rule: "TS-2"
    players:
      - {name: A, sitout: true}
      - {name: B, sitout: true}
    expect: {}
    not_counted: [A, B]

  - name: Empty channel
    rule: "TS-2"
    players: []
    expect: {}

  - name: Bots in the channel are ignored
    rule: "SE-7"
    players:
      - {name: MusicBot, bot: true}
      - {name: A, has: [Test Buff]}
      - {name: B}
    expect:
      A: {}
      B: {CM: 2}

  - name: No character set up still gives Support, and receives
    rule: "SE-6"
    players:
      - {name: Dana, no_character: true, roles: [Junior Adventurer]}
      - {name: B, has: [Champion of Power]}
    expect:
      Dana: {CM: 5, CR: 5}
      B:    {CM: 2}
    no_character: [Dana]

  # ---------------------------------------------------------------- SECTION 9
  - name: Full sample game (requirements section 9.1)
    rule: "section 9.1"
    players:
      - name: Ioseph
        level: 34
        roles: [Guild Vanguard]
        guilds: {GoTH: {}}
        has: [Nuyaru's Love, Seraph's Affection, Champion of Power]
      - name: Kael
        level: 8
        roles: [Junior Adventurer]
        guilds: {Cult: {rank: Member}}
      - name: Crateris
        level: 22
        guilds: {Cult: {rank: High Priest}}
        has: [Holy Aura, Bolstering Aura, Protective Aura, Devotion III, Wills ward stone]
      - name: Chris
        guilds: {Thieves: {rank: Guild Thief}}
        has: [Inspiring Presence]
      - name: Mira
        level: 15
        guilds: {Thieves: {rank: Footpad}, Cult: {rank: Member}}
        has: [Inspiring Presence]
      - {name: Dana, no_character: true}
      - {name: DM Sam, sitout: true}
      - {name: Bob, sitout: true}
    expect:
      Ioseph:   {CM: 10, CR: 5,  CR vs fear: 8}
      Kael:     {CM: 18, CR: 10, CR vs fear: 13, Damage: 1}
      Crateris: {CM: 12, CR: 10, CR vs fear: 10}
      Chris:    {CM: 23, CR: 10, CR vs fear: 13, CR stealth: 12}
      Mira:     {CM: 33, CR: 10, CR vs fear: 13, CR stealth: 12}
      Dana:     {CM: 20, CR: 10, CR vs fear: 13}
    effects:
      - {text: "Resistance to damage from an Evil source", from: Crateris,
         to: [Ioseph, Kael, Chris, Mira, Dana]}
    not_counted: [DM Sam, Bob]
    no_character: [Dana]
