# The item class game from requirements section 9.2 (TF-2a).
# ---------------------------------------------------------------------------
# AWT Voice holds the section 9.2 party: Elizor, Chris, Mira, Gus and Tess are
# counted; DM Sam is sitting out. Nobody has a Guild rank role, so only item
# class bonuses are in play.
#
# The item class counts aren't stored in fixtures: tests set them with
# /character items (IC-2), from the section 9.2 table:
#   Elizor passion 2, Chris passion 1, Mira glizzy 1, Gus glizzy 1, Tess glizzy 2,
#   and Sam's character Sable passion 3 (sitting out, so they add nothing).
#
# The entries are the test catalog's versions of the three class items
# (requirements 8.4 and 8.5).
#
# Player display names differ from character names on purpose, so tests can
# tell which one the bot used.
# ---------------------------------------------------------------------------

requirements: ["9.2", "4.14", "4.15", "IC-3"]
