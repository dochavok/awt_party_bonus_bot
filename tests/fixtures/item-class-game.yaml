catalog: catalog.yaml

discord:
  voice_channels:
    - {id: 100, name: AWT Voice}
  text_channels:
    - {id: 200, name: bonus-bot-support}
  members:
    - {handle: eli,  id: 3001, name: Eli,    voice: AWT Voice}
    - {handle: cam,  id: 3002, name: Cam,    voice: AWT Voice}
    - {handle: mia,  id: 3003, name: Mia,    voice: AWT Voice}
    - {handle: gil,  id: 3004, name: Gil,    voice: AWT Voice}
    - {handle: tia,  id: 3005, name: Tia,    voice: AWT Voice}
    - {handle: sam,  id: 3006, name: DM Sam, voice: AWT Voice}

players:
  - member: eli
    characters:
      - {name: Elizor, has: [will_passions_pendant]}
  - member: cam
    characters:
      - {name: Chris, has: [will_passions_adventure_token]}
  - member: mia
    characters:
      - {name: Mira}
  - member: gil
    characters:
      - {name: Gus, has: [glizzy_from_god]}
  - member: tia
    characters:
      - {name: Tess}
  - member: sam
    sitout_until: 2026-09-26T08:00:00Z
    characters:
      - {name: Sable}
