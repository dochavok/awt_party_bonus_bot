# A very large party (TS-7, OUT-3b, NF-2): 20 counted characters in Great Hall,
# each with as many bonuses as the test catalog allows, so the output is long
# enough that it has to be split across messages (TF-2a).
# ---------------------------------------------------------------------------
# One-holder entries (Champion of Power, High Priest) are left out, since only
# one character can hold each.
# ---------------------------------------------------------------------------

