# Keep dependencies current (NF-12).
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The Dockerfile's base images (python, uv), pinned by digest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
